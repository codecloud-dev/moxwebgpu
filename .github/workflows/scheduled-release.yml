# 可选定时发版：显式启用且存在未发布提交时运行。
name: Scheduled Release

on:
  schedule:
    - cron: '0 16 * * 2-4'
  workflow_dispatch:
    inputs:
      force:
        description: '强制发版（忽略未发布提交判断）'
        required: false
        default: 'false'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 闸门（未启用则退出）
        id: gate
        run: |
          if [ "${{ vars.ENABLE_SCHEDULED_RELEASE }}" != "true" ]; then
            echo "::notice::定时发布未启用，本次退出。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: 随机延迟
        if: steps.gate.outputs.enabled == 'true'
        run: |
          SEC=$(( RANDOM % 14400 ))
          echo "随机延迟 $SEC 秒，避免固定时刻集中触发。"
          sleep "$SEC"

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 git 身份
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 检测是否有未发布提交
        id: change
        if: steps.gate.outputs.enabled == 'true'
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "尚无任何 tag，视为有待发布内容"; echo "has_changes=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          COUNT=$(git rev-list --count "$LATEST"..HEAD)
          if [ "$COUNT" -gt 0 ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "距 $LATEST 有 $COUNT 个未发布提交"; echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "无未发布提交，跳过"; echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Node + pnpm 环境
        if: steps.change.outputs.has_changes == 'true'
        uses: pnpm/action-setup@v4

      - name: Node 环境
        if: steps.change.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 升版本、打 tag 并发布
        if: steps.change.outputs.has_changes == 'true'
        run: |
          npm version patch --no-git-tag-version
          VER=$(node -p "require('./package.json').version")
          git add package.json pnpm-lock.yaml
          git commit -m "chore(release): v$VER [skip ci]"
          git tag "v$VER"
          git push origin HEAD --follow-tags
          pnpm install --frozen-lockfile
          pnpm build
          pnpm publish --provenance --no-git-checks --access public
