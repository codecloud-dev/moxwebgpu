name: Deploy site to GitHub Pages

# 部署站点到 GitHub Pages：
#   /       → 液态玻璃演示页（构建后的浏览器 bundle）
#   /docs/  → 双语文档站（中/英切换按钮）
# 产出 https://codecloud-dev.github.io/moxwebgpu/
# 仅用仓库自带的 GITHUB_TOKEN，无需额外密钥。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Assemble site (demo + docs)
        run: |
          mkdir -p _site/docs _site/demo
          # 演示页（根 + /demo/，两者都可用，README 链接指向 /demo/）
          cp demo/index.html _site/index.html
          cp demo/index.html _site/demo/index.html
          cp dist/moxwebgpu.browser.js _site/moxwebgpu.browser.js
          cp dist/moxwebgpu.browser.js _site/demo/moxwebgpu.browser.js
          # 双语文档站
          cp docs/index.html _site/docs/index.html
          cp -r assets _site/assets

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
