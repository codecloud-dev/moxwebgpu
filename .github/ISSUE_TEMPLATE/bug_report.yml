name: "🐛 Bug 报告 / Bug report"
description: "踩到坑了？把现场告诉我，我来修。"
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **安全漏洞请勿公开提交**：如果你发现的是安全漏洞（越权、注入、凭据泄露、供应链篡改等），**不要**在公开 Issue 里贴细节或 PoC。
        > 请走 https://mox-site.pages.dev/security （支持完全匿名），或各仓 `Security → Report a vulnerability`。
        > 行为准则投诉走独立通道：https://mox-site.pages.dev/report 。

  - type: markdown
    attributes:
      value: |
        感谢来“批斗”我 😄 填得越详细，我修得越快。
  - type: textarea
    id: what
    attributes:
      label: "你遇到了什么 / What happened"
      description: "现象描述，比如“点开就闪退”"
      placeholder: "简短描述你看到的问题"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "怎么复现 / Steps to reproduce"
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 看到 …
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: "环境 / Environment"
      placeholder: "系统 / 版本 / 浏览器 / 手机型号 / Termux 版本 …"
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: "严重程度 / Severity"
      options:
        - "崩了，完全用不了 / Broken"
        - "能用但很难受 / Annoying"
        - "小毛病 / Minor"
    validations:
      required: false
        **安全漏洞请不要在这里提**，改走 SECURITY.md 的私密渠道。
